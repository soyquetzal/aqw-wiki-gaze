name: Update wiki data

on:
  schedule:
    # Once a day. The first runs work through the backlog, later ones only
    # fetch pages that changed.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max pages to fetch in this run (0 = no limit)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Crawl
        run: node tools/crawler/crawl.mjs --budget-minutes 300 --limit "${{ inputs.limit || 0 }}"

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update $(date -u +%F)"
            git push
          fi
